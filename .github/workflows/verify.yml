name: Verify business workflows
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: family_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U test -d family_test' --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.lock
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://test:test-only-ci-password@localhost:5432/family_test
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test-only-ci-password@localhost:5432/family_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
